name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security-hardening-2026-10-12]

permissions:
  contents: read

jobs:
  app:
    name: Application lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
        continue-on-error: true # Existing repository-wide formatting backlog; keep build validation running.
      - run: npm run build

  edge-functions:
    name: Supabase Edge Function type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
